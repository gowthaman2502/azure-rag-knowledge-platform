[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gowthaman2502", email = "gowthamand2502@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "azure-search-documents>=12.0.0",
    "azure-storage-blob>=12.30.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-azure-ai>=1.2.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.3.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
rag-knowledge-assistant = "rag_knowledge_assistant:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
